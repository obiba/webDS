<!doctype html>
<html>
  <head>
    <!-- static hosts (GitHub Pages) cannot send COOP/COEP headers: a service worker adds them,
         so webR can use SharedArrayBuffer (interrupt, readline). No-op when already isolated. -->
    <script src="coi-serviceworker.js"></script>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>"
    />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
